<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="960" height="420" rx="12" fill="#f6f8fa"/>
  <style>
    .t{fill:#16202c;font-size:13.5px;font-weight:600}
    .s{fill:#64748b;font-size:11.5px}
    .card{fill:#fff;stroke:#c9d3de}
    .ion{fill:#8fbde8;stroke:#245a8d}
    .el{fill:#16202c}
    .wall{fill:#d7dee7;stroke:#94a3b8}
  </style>
  <text x="30" y="32" class="t" font-size="16">three pictures worth keeping</text>

  <!-- A: exchange desk -->
  <g transform="translate(30,54)">
    <rect width="290" height="330" rx="10" class="card"/>
    <text x="16" y="28" class="t">1 · the exchange desk</text>

    <!-- crowd of ions -->
    <g>
      <circle cx="46" cy="90" r="11" class="ion"/><text x="46" y="94" text-anchor="middle" font-size="9" fill="#245a8d">Na⁺</text>
      <circle cx="80" cy="120" r="11" class="ion"/><text x="80" y="124" text-anchor="middle" font-size="9" fill="#245a8d">Cl⁻</text>
      <circle cx="44" cy="150" r="11" class="ion"/><text x="44" y="154" text-anchor="middle" font-size="9" fill="#245a8d">K⁺</text>
      <circle cx="82" cy="180" r="11" class="ion"/><text x="82" y="184" text-anchor="middle" font-size="9" fill="#245a8d">Cl⁻</text>
      <circle cx="48" cy="212" r="11" class="ion"/><text x="48" y="216" text-anchor="middle" font-size="9" fill="#245a8d">Na⁺</text>
    </g>


    <!-- desk -->
    <rect x="118" y="80" width="46" height="150" rx="6" fill="#b9c3cf" stroke="#8a99ab"/>
    <text x="141" y="160" text-anchor="middle" class="s" transform="rotate(-90 141 160)">the electrode</text>

    <!-- electrons -->
    <g class="el">
      <circle cx="200" cy="110" r="7"/><circle cx="228" cy="110" r="7"/><circle cx="256" cy="110" r="7"/>
      <circle cx="214" cy="150" r="7"/><circle cx="242" cy="150" r="7"/><circle cx="270" cy="150" r="7"/>
    </g>
    <path d="M196 190 L 272 190" stroke="#64748b" stroke-width="3"/>
    <text x="16" y="258" class="s">left: ions — the body's only currency</text>
    <text x="16" y="274" class="s">right: electrons — the wire's only currency</text>
    <text x="16" y="300" class="s">Nobody crosses the counter. The desk</text>
    <text x="16" y="316" class="s">converts one currency into the other.</text>
  </g>

  <!-- B: revolving door -->
  <g transform="translate(340,54)">
    <rect width="290" height="330" rx="10" class="card"/>
    <text x="16" y="28" class="t">2 · the revolving door</text>
    <text x="16" y="46" class="s" fill="#1b7f4b">silver–silver chloride</text>

    <rect x="130" y="70" width="18" height="180" class="wall"/>
    <g stroke="#1b7f4b" stroke-width="2.5" fill="none">
      <circle cx="139" cy="160" r="34"/>
      <path d="M139 126 L 139 194 M105 160 L 173 160"/>
    </g>
    <g class="ion">
      <circle cx="70" cy="120" r="10"/><circle cx="60" cy="200" r="10"/>
    </g>
    <g class="el">
      <circle cx="210" cy="120" r="7"/><circle cx="220" cy="200" r="7"/>
    </g>
    <path d="M86 130 L 110 148" stroke="#1b7f4b" stroke-width="2" marker-end="url(#m)"/>
    <path d="M172 176 L 198 192" stroke="#1b7f4b" stroke-width="2" marker-end="url(#m)"/>
    <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b7f4b"/></marker></defs>

    <text x="16" y="284" class="s">The door turns, so traffic flows in either</text>
    <text x="16" y="300" class="s">direction, fast or slow. Behaves like a</text>
    <text x="16" y="316" class="s">resistor: steady even at 0.5 Hz.</text>
  </g>

  <!-- C: glass door -->
  <g transform="translate(650,54)">
    <rect width="280" height="330" rx="10" class="card"/>
    <text x="16" y="28" class="t">3 · the glass door</text>
    <text x="16" y="46" class="s" fill="#b45309">gold, platinum, steel</text>

    <rect x="130" y="70" width="14" height="180" fill="#e8f0fe" stroke="#94a3b8"/>
    <g class="ion">
      <circle cx="112" cy="110" r="10"/><circle cx="112" cy="140" r="10"/>
      <circle cx="112" cy="170" r="10"/><circle cx="112" cy="200" r="10"/>
    </g>
    <g class="el">
      <circle cx="162" cy="110" r="7"/><circle cx="162" cy="140" r="7"/>
      <circle cx="162" cy="170" r="7"/><circle cx="162" cy="200" r="7"/>
    </g>
    <text x="16" y="268" class="s">Nobody gets through; they crowd against</text>
    <text x="16" y="284" class="s">the glass. A hard knock still shakes the</text>
    <text x="16" y="300" class="s">door — a slow push does not. Behaves</text>
    <text x="16" y="316" class="s">like a capacitor: passes fast, blocks slow.</text>
  </g>
</svg>
